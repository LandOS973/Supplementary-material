seed: 0
verbose: true
nb_instances_test: 10
nb_restarts: 10
budget: 50000
visualization: false

# Config SE-SVGD-EDA du papier (m=7, λ=13, ε=0.06, γ=0.01 constant, E=6, β=0.1).
agent:
  M: 7
  lambda: 13
  advantage: peragentrankweighted # peragentrankweighted | peragentbaselineglobalstd | peragentbaselineglobalstd | globalrankweighted | baseline | normalizedfitness | baseline_rescaled
  kernel: rbf # rbf | no_interact
  epsilon_svgd: 0.05 # Pas de mise à jour des particules
  gamma: 0.01 # Ponderation de l'attraction vers les zones de haute densité
  no_interact: false
  no_repulsion: false
  enable_greedy_final: true
  decay_start_ratio: 0.03
  min_factor: 0.01
  decay: false # γ constant ; SVGD-EDA (PPSN) : decay true, gamma 0.015, epsilon_svgd 0.08, ppo_active false
  ppo_active: true
  ppo:
    ppo_epochs: 6
    beta: 0.1

problem_name: qubo

problems:
  qubo:
    name: qubo
    dim: 128
    type_instance: 5

  nk:
    name: NK
    dim: 128
    type_instance: 8

  nk3:
    name: NK3
    dim: 256
    type_instance: 8

  anr:
    name: VIENNARNA
    target_name: Frog Foot
    target_source: https://raw.githubusercontent.com/eternagame/eterna100-benchmarking/master/data/eterna100_puzzles.tsv
    nevergrad_algo: DiscreteDE
    num_workers: null

  blockwise:
    name: BLOCK
    n: 256
    k: 256
    dummy_blocks: 0

problem: ${problems.${problem_name}}
