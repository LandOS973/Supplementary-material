seed: 0
verbose: true
nb_instances_test: 10
nb_restarts: 10
budget: 50000
visualization: true

agent:
  M: 10
  lambda: 10
  advantage: peragentrankweighted # peragentrankweighted | globalrankweighted | baseline | normalizedfitness | baseline_rescaled
  kernel: rbf # rbf | no_interact
  epsilon_svgd: 0.06 # Pas de mise à jour des particules
  gamma: 0.006 # Ponderation de l'attraction vers les zones de haute densité
  no_interact: false
  no_repulsion: false
  enable_greedy_final: true
  decay_start_ratio: 0.1
  min_factor: 0.1
  decay: false
  ppo_active: true
  ppo:
    ppo_epochs: 4
    beta: 0.01

problem_name: nk3

problems:
  qubo:
    name: QUBO
    dim: 64
    type_instance: 5

  nk:
    name: NK
    dim: 64
    type_instance: 1

  nk3:
    name: NK3
    dim: 64
    type_instance: 8

  anr:
    name: VIENNARNA
    target_name: Gladius
    target_source: https://raw.githubusercontent.com/eternagame/eterna100-benchmarking/master/data/eterna100_puzzles.tsv
    nevergrad_algo: DiscreteDE
    num_workers: null

  blockwise:
    name: BLOCK
    n: 256
    k: 256
    dummy_blocks: 0

problem: ${problems.${problem_name}}
