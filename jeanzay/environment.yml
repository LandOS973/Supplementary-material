name: ppo_env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pytorch
  - torchvision
  - pytorch-cuda=11.8
  - tqdm
  - matplotlib
  - hydra-core
  - omegaconf
  - pip
  - pip:
      - ViennaRNA   # bindings Python `import RNA`, requis par les runs ViennaRNA
      - nevergrad==1.0.12   # version utilisee dans le papier (Section 4.2) ; pinner via pip, pas conda
